name: Go Backend Verify

on:
  push:
    branches:
      - main
      - feat/go-backend
    paths:
      - 'go/**'
      - 'client/**'
      - '.github/workflows/go-verify.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'go/**'
      - 'client/**'
      - '.github/workflows/go-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go build, format, vet and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Format check
        working-directory: go
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Test
        working-directory: go
        run: go test ./...

  go-race:
    name: Go race tests (run lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Race tests
        working-directory: go
        run: |
          go test -race \
            ./internal/app/agentrun \
            ./internal/app/maa \
            ./internal/app \
            ./internal/app/scheduler \
            ./internal/transport/agentapi

  client-verify:
    name: Client lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Verify client
        run: npm run verify --prefix client

  go-cross-build:
    name: Go cross build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Cross build
        working-directory: go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build ./cmd/server
          go build .

  go-docker:
    name: Go Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f go/Dockerfile -t la-pluma-go:ci .