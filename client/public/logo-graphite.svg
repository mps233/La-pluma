    <ellipse cx="370" cy="410" rx="150" ry="120" fill="url(#pluma-mint)" filter="url(#pluma-blur)"/>

    <path d="M64 56C200 6 402 40 472 168 408 94 244 70 64 56Z" fill="url(#pluma-sheen)" opacity="0.85"/>
    <path d="M32 300C120 432 344 490 488 352 380 438 170 424 32 300Z" fill="#73e4ff" opacity="0.12" filter="url(#pluma-soft)"/>

    <!-- A full quill: broad layered vane, feather splits, shaft, nib and the operator's green fitting. -->
    <g>
      <path d="M168 360C186 306 216 254 256 208C298 160 346 118 400 92C398 130 390 164 378 194L360 198C368 216 364 234 352 250L332 252C338 270 328 290 312 304L292 304C296 320 284 336 264 346C242 358 214 364 190 358L168 360Z" fill="url(#pluma-vane-back)" transform="translate(-8 9)"/>
      <path d="M168 360C186 306 216 254 256 208C298 160 346 118 400 92C398 130 390 164 378 194L360 198C368 216 364 234 352 250L332 252C338 270 328 290 312 304L292 304C296 320 284 336 264 346C242 358 214 364 190 358L168 360Z" fill="url(#pluma-vane)" mask="url(#pluma-vane-mask)"/>
      <path d="M168 360C186 306 216 254 256 208C298 160 346 118 400 92C398 130 390 164 378 194L360 198C368 216 364 234 352 250L332 252C338 270 328 290 312 304L292 304C296 320 284 336 264 346C242 358 214 364 190 358L168 360Z" fill="none" stroke="#e9faff" stroke-opacity="0.5" stroke-width="2.5"/>
      <path d="M174 352C156 348 140 338 130 324C148 328 168 336 188 342C194 348 186 356 174 352Z" fill="url(#pluma-tuft)"/>
      <path d="M190 336C170 326 156 306 154 284C170 296 184 310 196 326Z" fill="url(#pluma-tuft)"/>
      <path d="M198 330C184 314 176 294 178 274C190 288 200 304 206 320Z" fill="url(#pluma-tuft)" opacity="0.82"/>
      <path d="M208 324C200 308 198 292 204 278C210 292 214 306 214 318Z" fill="url(#pluma-tuft)" opacity="0.58"/>

      <path d="M192 334C226 284 268 238 314 192C340 166 366 140 390 116" fill="none" stroke="#ffffff" stroke-opacity="0.52" stroke-width="4" stroke-linecap="round"/>

      <path d="M140 436C212 366 300 250 400 92" fill="none" stroke="url(#pluma-shaft)" stroke-width="7" stroke-linecap="round"/>
      <path d="M140 436C212 366 300 250 400 92" fill="none" stroke="#e9fcff" stroke-opacity="0.57" stroke-width="2.4" stroke-linecap="round"/>

      <path d="M174 352C166 370 156 392 146 414L158 426C170 402 182 376 192 358Z" fill="url(#pluma-handle)" stroke="#1b3a43" stroke-width="2" stroke-linejoin="round"/>
      <path d="M166 388L188 370" stroke="url(#pluma-green)" stroke-width="4" stroke-linecap="round"/>
      <path d="M146 414L130 444L164 426Z" fill="url(#pluma-nib)" stroke="#d9f8ff" stroke-opacity="0.45" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M150 426L142 440" fill="none" stroke="#0b2a36" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round"/>

      <circle cx="180" cy="352" r="12.5" fill="#081419" stroke="#b6ff5c" stroke-opacity="0.78" stroke-width="2"/>
      <circle cx="180" cy="352" r="4.2" fill="#0f2c33"/>
    </g>

    <ellipse cx="144" cy="96" rx="138" ry="62" transform="rotate(-24 144 96)" fill="url(#pluma-spec)" filter="url(#pluma-soft)" opacity="0.82"/>
    <ellipse cx="188" cy="72" rx="48" ry="20" transform="rotate(-24 188 72)" fill="#ffffff" opacity="0.28" filter="url(#pluma-soft)"/>
    <path d="M56 300C132 430 350 468 468 340" fill="none" stroke="#a9f1ff" stroke-opacity="0.2" stroke-width="10" filter="url(#pluma-soft)"/>
  </g>

  <use href="#pluma-square" fill="none" stroke="url(#pluma-rim)" stroke-width="5"/>
  <use href="#pluma-square" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="2" transform="translate(256 256) scale(0.956) translate(-256 -256)"/>
</svg>
